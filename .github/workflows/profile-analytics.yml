name: Update GitHub profile analytics

on:
  schedule:
    - cron: "17 3 * * *" # 08:47 Asia/Kolkata daily
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "scripts/generate_streak.py"

concurrency:
  group: profile-analytics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Test contribution parser and streak calculation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&bg_color=111111&title_color=7C3AED&text_color=f3f4f6&icon_color=7C3AED&border_color=7C3AED&border_radius=8
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=111111&title_color=7C3AED&text_color=f3f4f6&border_color=7C3AED&border_radius=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate and verify Asia/Mumbai streak card
        run: python scripts/generate_streak.py

      - name: Commit generated analytics cards
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase can conflict when separate runs generate different SVG bytes.
          # Reset the index to latest main but preserve generated SVGs in the
          # working tree, then commit only those three assets.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add profile/stats.svg profile/top-langs.svg profile/streak.svg

            if git diff --cached --quiet; then
              echo "Analytics cards are already up to date."
              exit 0
            fi

            git commit -m "Update GitHub profile analytics"
            if git push origin HEAD:main; then
              echo "Analytics cards pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying against the latest main."
          done

          echo "Could not push analytics cards after 3 attempts."
          exit 1
